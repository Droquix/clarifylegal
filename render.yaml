services:
  - type: web
    name: clarifylegal-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://clarifylegal.vercel.app,https://*.vercel.app,http://localhost:5173
